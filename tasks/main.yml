---
# rhel_cockpit Main Tasks Entrypoint

# Step 1: Validates that the target OS is Red Hat / EL 9 or 10
- name: Run pre-flight OS validation
  ansible.builtin.include_tasks: preflight.yml

# Step 2: Installs the Cockpit web suite
- name: Install Cockpit packages
  ansible.builtin.include_tasks: packages.yml

# Step 3: Configures /etc/cockpit/cockpit.conf with the CIS session idle timeout
- name: Configure Cockpit session idle timeout
  ansible.builtin.include_tasks: config.yml
  when: rhel_cockpit_manage_config | bool

# Step 4: Enables and starts systemd socket activation on port 9090
- name: Manage Cockpit systemd socket activation
  ansible.builtin.include_tasks: service.yml

# Step 5: Configures firewalld to permanently permit Cockpit web traffic (port 9090)
- name: Configure firewall rules for Cockpit
  ansible.builtin.include_tasks: firewall.yml
  when: rhel_cockpit_manage_firewall | bool

