---
# rhel cockpit task main entry point

# Step 1: validate that the target OS is Red Hat 9 or 10
- name: Run pre flight OS validaton
  ansible.builtin.include_tasks: preflight.yml

# Step 2: Install cockpit suite and ensure virt-manager is absent
- name: Install cockpit packages and remove GUI tools
  ansible.builtin.include_tasks: packages.yml

# Step 3: Configures /etc/cockpit/cockpit.conf with security banner and idle timeouts
- name: Configure Cockpit service settings
  ansible.builtin.include_tasks: config.yml
  when: cockpit_manage_config | bool

# Step 4: Enables and starts systemd socket activation on port 9099
- name: Manage Cockpit systemd socket activation
  ansible.builtin.include_tasks: service.yml

# Step 5: Configures firewalld to permanently permit Cockpit web traffic (port 9090)
- name: Configure firewall rules for cockpit
  ansible.builtin.include_tasks: firewall.yml
  when: cockpit_manage_firewall | bool
