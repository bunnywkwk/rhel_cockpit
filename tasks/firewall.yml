---
# Firewall Configuration

# Gathers system service status facts without invoking shell commands
- name: Gather system service facts
  ansible.builtin.service_facts:

# Permanently permits Cockpit service (TCP port 9090) through firewalld if active
- name: Permit Cockpit service through firewalld
  ansible.posix.firewalld:
    service: "{{ cockpit_firewall_service }}"
    zone: "{{ cockpit_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when:
    - "'firewalld.service' in ansible_facts.services"
    - "ansible_facts.services['firewalld.service']['state'] == 'running'"
  notify: Reload firewalld
