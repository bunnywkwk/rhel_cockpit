---

# rhel_cockpit Handlers

# Restarts cockpit.socket when configuration changes
- name: Restart cockpit.socket
  ansible.builtin.systemd_service:
    name: "{{ rhel_cockpit_service_name }}"
    state: restarted

# Reload firewalld rules without disconnecting active sessions
- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded
  failed_when: false
